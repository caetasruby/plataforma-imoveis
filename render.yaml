# Blueprint do Render: um serviço web (Docker) e uma base de dados PostgreSQL gratuitos
services:
  - type: web
    name: kaya-justa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/anuncios/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kaya-justa-bd
          property: connectionString

databases:
  - name: kaya-justa-bd
    plan: free
