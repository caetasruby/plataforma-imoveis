server {
    listen 80;
    client_max_body_size 50m;          # até 8 fotografias de 5 MB

    # API REST e painel interno do Django
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location /django-admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # Fotografias e ficheiros estáticos do Django (volumes partilhados)
    location /media/ { alias /dados/media/; expires 7d; }
    location /static/ { alias /dados/static/; expires 7d; }

    # Aplicação React (SPA): qualquer outro caminho devolve o index.html
    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
