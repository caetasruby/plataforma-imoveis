# Kaya Justa: Plataforma Inteligente de Apoio à Decisão (Fase III)
# Arquitectura em 3 camadas: cliente React (nginx), servidor Django, PostgreSQL.
name: kaya-justa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imoveis
      POSTGRES_USER: imoveis
      POSTGRES_PASSWORD: imoveis
    volumes:
      - dados_bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imoveis -d imoveis"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: kaya-justa-backend:1.0
    environment:
      POSTGRES_DB: imoveis
      POSTGRES_USER: imoveis
      POSTGRES_PASSWORD: imoveis
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "troque-esta-chave-em-producao-kaya-justa-2026"
      DJANGO_ALLOWED_HOSTS: "*"
      MEDIA_ROOT: /dados/media
      STATIC_ROOT: /dados/static
      # Assistente com IA local: o Ollama corre no computador, fora dos contentores
      OLLAMA_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ficheiros:/dados
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: kaya-justa-frontend:1.0
    ports:
      - "3000:80"
    volumes:
      - ficheiros:/dados:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dados_bd:
  ficheiros:
